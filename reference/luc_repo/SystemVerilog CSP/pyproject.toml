[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svcsp"
version = "0.2.0"
description = "SystemVerilog CSP frontend and four-phase structural Verilog compiler"
requires-python = ">=3.10"
dependencies = ["pyslang==11.0.0"]

[project.scripts]
svcsp = "svcsp.__main__:main"

[tool.setuptools.packages.find]
include = ["svcsp*"]

[tool.setuptools.package-data]
svcsp = ["rtl/*.v"]
